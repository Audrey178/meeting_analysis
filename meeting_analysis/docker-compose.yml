# Redis cho cache kết quả pipeline v3 (be/services/analysis_cache.py, V3_CACHE=redis).
#   docker compose up -d redis     # chạy nền; dữ liệu giữ trong volume redis-data qua các lần restart
#   docker compose down            # dừng (thêm -v để xoá luôn dữ liệu cache)
# Backend đọc V3_CACHE_REDIS_URL (mặc định redis://localhost:6379/0).
services:
  redis:
    image: redis:7.4-alpine
    container_name: meeting-analysis-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379" # chỉ mở cho máy này
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting-analysis-postgres
    environment:
      POSTGRES_DB: meeting_assistant
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
