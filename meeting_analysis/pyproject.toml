[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-analysis"
version = "0.2.0"
description = "Evidence-grounded meeting analysis pipeline contracts and MVP scaffold"
requires-python = ">=3.11"
dependencies = [
    # experiments/treeseg_turn_level/treeseg.py and experiments/dialstart:
    # topic segmentation math.
    "numpy>=1.26",
    # src/agentic_v3/graph: Send()-based fan-out (topics and agents in parallel)
    # + fan-in orchestration.
    # Pinned to a version confirmed installed/tested, not a guess.
    "langgraph>=1.2.11",
]

[project.optional-dependencies]
# be/main.py: HTTP backend for the pipeline. Kept out of core `dependencies`
# -- the CLI scripts and stage library don't need a web framework, same
# reasoning as keeping `openai` import-lazy in
# _build_llm_adapter/_build_embedding_adapter.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # be/services/analysis_cache.py: cache kết quả v3 trên Redis (V3_CACHE=redis, mặc định).
    "redis>=5.0",
]

# src/utils/local_embeddings.py: open-source embedding backend
# (EMBEDDING_BACKEND=local). Optional for the same reason as `api`/`openai`:
# torch is heavy and only needed when that backend is chosen.
local-embeddings = [
    "sentence-transformers>=3.0",
    "torch",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
